<!doctype html>
<!-- ID+ Carômetro – página de entrada (GitHub Pages)
     v13 – 21/11/2026 – iPhone: o app agora começa ABAIXO da barra de status (hora/bateria/sinal), que antes cobria o topo do cabeçalho. Android não muda.
     v12 – 21/11/2026 – aviso no rodapé da tela de espera: "Aguarde um instante"; passados 8 s sem carregar, troca para "Quase lá, só mais um pouquinho"
     v11 – 21/11/2026 – tela de espera: ícone rosa trocado pelo crachá (cracha-espera.webp, 150px de largura), com pulsada média e brilho rosa
     v10 – 21/11/2026 – tela de espera maior: ícone 100px, pulsada média, CARÔMETRO 26px, barra 200x7px, by Billy 28px, espaço 20px
     v9  – assinatura "by Billy" em Lora Itálico semi-negrito -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ID+ Carômetro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ID+ Carômetro – conheça quem dança com você.">
<!-- Ícone rosa: iPhone (apple-touch-icon), Android (manifest) e navegador (favicon) -->
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A2234">
<!-- No iPhone, o atalho abre em tela cheia, sem a barra do Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ID+">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- v9: fontes da tela de espera (Montserrat Black pro selo/texto, Lora Itálico pra assinatura "by Billy").
     display=swap garante que o texto aparece na hora, numa fonte padrão, e troca suave quando a fonte chega —
     nunca fica em branco esperando. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Lora:ital,wght@1,400;1,600;1,700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="cracha-espera.webp">
<style>
  html, body { margin:0; padding:0; height:100%; background:#0A2234; overflow:hidden; }
  /* v13: no iPhone em tela cheia a barra de status (hora, bateria) fica por cima da página (black-translucent).
     O app começa logo abaixo dela; a faixa de cima fica azul-marinho, igual ao fundo. No Android env() vale 0 e nada muda. */
  iframe { position:fixed; top:env(safe-area-inset-top, 0px); left:0; width:100%; height:calc(100% - env(safe-area-inset-top, 0px)); border:0; display:block; }
  /* v4: tela de espera "Preparando o Carômetro..." — some assim que o app carrega
     v8: texto simplificado pra "CARÔMETRO...", selo e texto em Montserrat Black (sem respiro apertado),
         assinatura "by Billy" maior e com brilho
     v10: tudo um pouco maior (ver cabeçalho do arquivo)
     v9: assinatura "by Billy" trocada pra Lora Itálico (semi-negrito) */
  #espera { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
    background:radial-gradient(circle at 50% 40%, #16324F 0%, #0A2234 70%); color:#fff; font-family:Arial, Helvetica, sans-serif;
    transition:opacity .45s ease; }
  #espera.some { opacity:0; pointer-events:none; }
  /* v11: o crachá (imagem) no lugar do quadrado rosa. 150px de largura; a altura acompanha a imagem. */
  #espera .cracha { display:block; width:150px; height:auto; animation:pulsa 1.4s ease-in-out infinite;
    filter:drop-shadow(0 8px 22px rgba(236,38,143,.45)); }
  #espera .texto { font-family:'Montserrat', Arial, Helvetica, sans-serif; font-size:26px; font-weight:900; letter-spacing:.5px; }
  #espera .texto span { display:inline-block; animation:pontos 1.2s steps(4,end) infinite; width:1.3em; text-align:left; overflow:hidden; vertical-align:bottom; }
  #espera .barra { width:200px; height:7px; border-radius:4px; background:rgba(255,255,255,.18); overflow:hidden; }
  #espera .barra i { display:block; width:40%; height:100%; border-radius:4px; background:#EC268F; animation:corre 1.3s ease-in-out infinite; }
  /* v9: assinatura em Lora Itálico, peso semi-negrito (600) */
  #espera .assinatura { font-family:'Lora', Georgia, serif; font-style:italic; font-size:28px; font-weight:600; letter-spacing:.3px; color:#fff; margin-top:0;
    text-shadow:0 0 16px rgba(236,38,143,.9), 0 0 3px rgba(255,255,255,.55); }
  #espera .assinatura b { color:#F6A6D1; font-weight:600; }
  /* v10: pulsada média (antes leve: 1.08) */
  /* v12: aviso no rodapé da tela de espera. Posição pela altura da tela (8vh, entre 28px e 80px) pra nunca encostar no "by Billy" em celular pequeno. */
  #espera .aviso { position:absolute; left:0; right:0; bottom:calc(clamp(28px, 8vh, 80px) + env(safe-area-inset-bottom, 0px));
    padding:0 20px; text-align:center; font-family:'Montserrat', Arial, Helvetica, sans-serif; font-size:16px; font-weight:700; line-height:1.3;
    color:rgba(255,255,255,.82); transition:opacity .3s ease; }
  #espera .aviso.troca { opacity:0; }
  @keyframes pulsa { 0%,100% { transform:scale(1); filter:drop-shadow(0 8px 22px rgba(236,38,143,.45)); } 50% { transform:scale(1.07); filter:drop-shadow(0 12px 30px rgba(236,38,143,.7)); } }
  @keyframes pontos { 0% { width:0; } 100% { width:1.3em; } }
  @keyframes corre { 0% { transform:translateX(-100%); } 100% { transform:translateX(260%); } }
  /* Plano B: se o app não carregar dentro da porta em 15 s, aparece um botão para abrir direto */
  #planoB { position:fixed; left:16px; right:16px; bottom:max(24px, env(safe-area-inset-bottom)); display:none;
    padding:14px; border-radius:14px; background:#EC268F; color:#fff; text-align:center; text-decoration:none;
    font:700 16px/1.2 Arial, Helvetica, sans-serif; box-shadow:0 6px 18px rgba(0,0,0,.35); }
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbzFXwTnhdzgTsCsT_p2FH0Go7FYmBX5H6LJ3wzgLh6vvSeMLLCb2yyi1eb7rKN5Ge-nNw/exec" title="ID+ Carômetro" allow="clipboard-write; autoplay; fullscreen"></iframe>
<div id="espera" aria-live="polite"><img class="cracha" src="cracha-espera.webp" width="150" alt=""><div class="texto">CARÔMETRO<span>...</span></div><div class="barra"><i></i></div><div class="assinatura">by <b>Billy</b></div><div class="aviso" id="aviso">Aguarde um instante</div></div>
<a id="planoB" href="https://script.google.com/macros/s/AKfycbzFXwTnhdzgTsCsT_p2FH0Go7FYmBX5H6LJ3wzgLh6vvSeMLLCb2yyi1eb7rKN5Ge-nNw/exec">Abrir o ID+</a>
<script>
  var carregou = false;
  document.getElementById('app').addEventListener('load', function () {
    carregou = true;
    // v7: sem tempo mínimo — a tela de espera some assim que o app carregar.
    var e = document.getElementById('espera');
    if (e) { e.classList.add('some'); setTimeout(function () { e.remove(); }, 500); }
  });
  // v12: passados 8 s sem carregar, o aviso troca (com esmaecido) para a segunda frase
  setTimeout(function () {
    var a = document.getElementById('aviso');
    if (carregou || !a) return;
    a.classList.add('troca');
    setTimeout(function () { a.textContent = 'Quase lá, só mais um pouquinho'; a.classList.remove('troca'); }, 300);
  }, 8000);
  setTimeout(function () { var e = document.getElementById('espera'); if (e) { e.classList.add('some'); setTimeout(function () { e.remove(); }, 500); } }, 15000);
  setTimeout(function () { if (!carregou) document.getElementById('planoB').style.display = 'block'; }, 15000);
</script>
</body>
</html>
